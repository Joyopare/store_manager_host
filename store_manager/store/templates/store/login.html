{% extends 'store/base.html' %}
{% block auth_content %}
<style>
.login-page {
  min-height:100vh; display:flex; align-items:center;
  justify-content:center; background:var(--bg);
  position:relative; overflow:hidden;
  transition: background 0.25s;
}
.login-page::before {
  content:''; position:absolute;
  width:600px; height:600px; border-radius:50%;
  background:radial-gradient(circle,rgba(79,124,255,0.08) 0%,transparent 70%);
  top:-100px; right:-100px;
}
.login-page::after {
  content:''; position:absolute;
  width:400px; height:400px; border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,252,0.06) 0%,transparent 70%);
  bottom:-50px; left:-50px;
}
.login-box { width:380px; position:relative; z-index:1; }
.login-logo { text-align:center; margin-bottom:36px; }
.login-logo .icon {
  width:64px; height:64px; border-radius:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px;
  box-shadow:0 8px 32px rgba(79,124,255,0.3);
}
.login-logo h1 { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
.login-logo p  { font-size:13px; color:var(--text3); margin-top:4px; }
.login-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:32px;
  transition: background 0.25s, border-color 0.25s;
}
.login-card h2  { font-size:17px; font-weight:700; margin-bottom:6px; }
.login-card .sub{ font-size:13px; color:var(--text3); margin-bottom:24px; }
.login-card .btn { width:100%; justify-content:center; padding:12px; font-size:14px; margin-top:4px; }

/* theme toggle on login page — top-right corner */
.login-theme-btn {
  position:fixed; top:16px; right:16px;
  width:44px; height:24px; border-radius:12px;
  background:var(--surface2); border:1px solid var(--border2);
  cursor:pointer; z-index:10; padding:0; position:fixed;
}
.login-theme-knob {
  position:absolute; top:2px; left:2px;
  width:18px; height:18px; border-radius:50%;
  background:var(--accent);
  transition:transform 0.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] .login-theme-knob { transform:translateX(20px); }
.lti { font-size:11px; position:absolute; top:50%; transform:translateY(-50%); pointer-events:none; }
.lti.moon { left:5px; }
.lti.sun  { right:4px; }
</style>

<!-- standalone toggle for login page -->
<button class="login-theme-btn" id="loginThemeBtn" title="Toggle theme">
  <span class="lti moon">🌙</span>
  <div class="login-theme-knob" id="loginThemeKnob"></div>
  <span class="lti sun">☀️</span>
</button>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏪</div>
      <h1>Store Manager</h1>
      <p>Store Management System</p>
    </div>
    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to manage your store</p>

      {% for message in messages %}
        <div class="alert alert-error">⚠️ {{ message }}</div>
      {% endfor %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In →</button>
      </form>
    </div>
  </div>
</div>

<script>
(function(){
  const html = document.documentElement;
  const btn  = document.getElementById('loginThemeBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    const cur = html.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('sf-theme', next);
  });
})();
</script>
{% endblock %}
